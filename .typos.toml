[files]
# Ignore entire files
extend-exclude = [
  "*.json",
  "*.jsonc",
  "*.zst",
  "**/t_mcp_stdio.rs",
  "**/t_mcp_http.rs",
]

[default]
# Custom ignore regex patterns: https://github.com/crate-ci/typos/blob/master/docs/reference.md#example-configurations
#
# Usage: Add a comment like `// typos: ignore` or `# typos: ignore` on the same line or
# use `// typos: ignore-next-line` to ignore the next line. Works with:
#   - // typos: ignore
#   - # typos: ignore
#   - /* typos: ignore */
#   - // typos: ignore-next-line
extend-ignore-re = [
  # Ignore line with inline comment: "typos: ignore" (same line)
  # Handles: //, #, /* */ style comments
  ".*(?:#|--|//|/\\*).*(?:typos):\\s?ignore[^\\n]*\\n",
  # Ignore next line: "typos: ignore-next-line"
  ".*(?:typos):\\s?ignore-next-line[^\\n]*\\n[^\\n]*",
]
