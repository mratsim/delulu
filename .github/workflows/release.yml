name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  build-all-mcp:
    name: Build all-mcp ${{ matrix.target.platform }} (${{ matrix.target.arch }})
    runs-on: ${{ matrix.target.os }}
    strategy:
      matrix:
        target:
          - { platform: Windows, lower_platform: windows, arch: x86_64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { platform: Windows, lower_platform: windows, arch: arm64, os: windows-latest, target: aarch64-pc-windows-msvc }
          - { platform: macOS, lower_platform: macos, arch: arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { platform: Linux, lower_platform: linux, arch: x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { platform: Linux, lower_platform: linux, arch: arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
    - uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        target: ${{ matrix.target.target }}

    - name: Install build dependencies (Linux)
      if: matrix.target.platform == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libclang-dev git

    - name: Cache cargo dependency
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/**/.fingerprint
          target/**/release/deps
          target/**/deps
        key: ${{ runner.os }}-${{ matrix.target.arch }}-cargo-all-mcp-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.target.arch }}-cargo-all-mcp-

    - run: |
        rustup target add ${{ matrix.target.target }}
        cargo build --release --target ${{ matrix.target.target }} -p delulu-all-mcp --features mcp

    - name: Strip executable (Linux)
      if: matrix.target.platform == 'Linux'
      run: strip target/${{ matrix.target.target }}/release/delulu-all-mcp

    - name: Create Windows archive
      if: matrix.target.platform == 'Windows'
      run: |
        cd target/${{ matrix.target.target }}/release
        7z a ../../../delulu-all-mcp-windows-${{ matrix.target.arch }}.zip delulu-all-mcp.exe

    - name: Create macOS/Linux archive
      if: matrix.target.platform != 'Windows'
      run: |
        cd target/${{ matrix.target.target }}/release
        tar -czvf ../../../delulu-all-mcp-${{ matrix.target.lower_platform }}-${{ matrix.target.arch }}.tar.gz delulu-all-mcp

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: delulu-all-mcp-${{ matrix.target.lower_platform }}-${{ matrix.target.arch }}-${{ env.VERSION }}
        path: |
          delulu-all-mcp-windows-${{ matrix.target.arch }}.zip
          delulu-all-mcp-${{ matrix.target.lower_platform }}-${{ matrix.target.arch }}.tar.gz
        if-no-files-found: error

  create-release:
    name: Create Release
    needs: [build-all-mcp]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Download all artifact
      uses: actions/download-artifact@v5
      with:
        path: artifact

    - name: Create release archive
      run: |
        cd artifact
        mkdir -p release
        find . -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} release/ \;
        ls -la release/

    - name: Create release notes
      id: release-notes
      run: |
        echo "tag_name=${{ env.VERSION }}" >> $GITHUB_OUTPUT
        cat > release-notes.md << EOF
        ## Release ${{ env.VERSION }}

        Prebuilt binary for 5 platform/arch combinations:

        - **Windows x86-64**: delulu-all-mcp-windows-x86_64.zip
        - **Windows ARM64**: delulu-all-mcp-windows-arm64.zip
        - **macOS ARM64**: delulu-all-mcp-macos-arm64.tar.gz
        - **Linux x86-64**: delulu-all-mcp-linux-x86_64.tar.gz
        - **Linux ARM64**: delulu-all-mcp-linux-arm64.tar.gz

        The `delulu-all-mcp` binary bundles all 21 tools (travel, webfetch,
        websearch, arXiv/IACR/PubMed papers, mcpify). The individual apps are
        built from source with cargo — see the README "Build from source"
        section.

        The binaries are statically compiled and ready to use.
        EOF

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release-notes.outputs.tag_name }}
        name: Release ${{ steps.release-notes.outputs.tag_name }}
        body_path: release-notes.md
        files: artifact/release/*
        draft: true
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

