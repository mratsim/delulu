name: Docker Release Build

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/all-mcp
jobs:
  build-and-push-all-mcp:
    name: Build all-mcp (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        - runner: ubuntu-latest
          platform: linux/amd64
          suffix: -amd64
        - runner: ubuntu-24.04-arm
          platform: linux/arm64
          suffix: -arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tag, label)
        id: meta-all-mcp
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/all-mcp
          tags: |
            type=raw,value=latest,suffix=${{ matrix.suffix }}
            type=ref,event=tag,suffix=${{ matrix.suffix }}

      - name: Build & push architecture-specific image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: delulu-all-mcp-runtime
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta-all-mcp.outputs.tags }}

  create-manifest-all-mcp:
    runs-on: ubuntu-latest
    needs: [build-and-push-all-mcp]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta-all-mcp
        uses: docker/metadata-action@v5
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository }}/all-mcp
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Create and push manifest
        env:
          IMG: ${{ env.REGISTRY }}/${{ github.repository }}/all-mcp
        run: |
          TAG_FLAG=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAG_FLAG="$TAG_FLAG -t $tag"
          done <<< "${{ steps.meta-all-mcp.outputs.tags }}"

          docker buildx imagetools create $TAG_FLAG \
            ${IMG}:latest-amd64 \
            ${IMG}:latest-arm64
