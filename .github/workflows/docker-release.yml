name: Docker Release Build

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/travel-agent

jobs:
  build-and-push-travel-agent:
    name: Build travel-agent (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        - runner: ubuntu-latest
          platform: linux/amd64
          suffix: -amd64
        - runner: ubuntu-24.04-arm
          platform: linux/arm64
          suffix: -arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tag, label)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # We only generate the internal architecture-specific tags here
          # We do NOT generate the public v1.0.0 or latest tags in this stage
          tags: |
            type=raw,value=latest,suffix=${{ matrix.suffix }}
            type=ref,event=tag,suffix=${{ matrix.suffix }}

      - name: Build & push architecture-specific image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  create-manifest-travel-agent:
    runs-on: ubuntu-latest
    needs: [build-and-push-travel-agent]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Re-generate the intended public tags (latest, v1.0.0)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Create and push manifest
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          # Build -t flags from newline-separated tags
          TAG_FLAG=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAG_FLAG="$TAG_FLAG -t $tag"
          done <<< "${{ steps.meta.outputs.tags }}"

          docker buildx imagetools create $TAG_FLAG \
            ${IMG}:latest-amd64 \
            ${IMG}:latest-arm64
  build-and-push-webfetch:
    name: Build webfetch (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        - runner: ubuntu-latest
          platform: linux/amd64
          suffix: -amd64
        - runner: ubuntu-24.04-arm
          platform: linux/arm64
          suffix: -arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tag, label)
        id: meta-webfetch
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/webfetch-agent
          tags: |
            type=raw,value=latest,suffix=${{ matrix.suffix }}
            type=ref,event=tag,suffix=${{ matrix.suffix }}

      - name: Build & push architecture-specific image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: delulu-webfetch-mcp
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta-webfetch.outputs.tags }}

  create-manifest-webfetch:
    runs-on: ubuntu-latest
    needs: [build-and-push-webfetch]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta-webfetch
        uses: docker/metadata-action@v5
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository }}/webfetch-agent
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Create and push manifest
        env:
          IMG: ${{ env.REGISTRY }}/${{ github.repository }}/webfetch-agent
        run: |
          TAG_FLAG=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAG_FLAG="$TAG_FLAG -t $tag"
          done <<< "${{ steps.meta-webfetch.outputs.tags }}"

          docker buildx imagetools create $TAG_FLAG \
            ${IMG}:latest-amd64 \
            ${IMG}:latest-arm64
