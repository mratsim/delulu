[package]
name = "delulu-webfetch"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"
description = "CLI tools and MCP server for web content fetching and markdown conversion"

[features]
default = ["cli", "mcp"]
use-xpath = []
cli = ["dep:clap"]
diagnostic = []
mcp = [
    "dep:schemars",
    "dep:rmcp",
    "dep:delulu-mcp-server-helper",
  ]

[dependencies]
scraper = "0.17"
ego-tree = "0.6"
regex = { version = "1.10", default-features = false, features = ["unicode-perl", "unicode-case"] }
delulu-rate-limited-crawler = { path = "../../delulu-internals/rate-limited-crawler" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-std", "io-util", "fs", "net"] }
anyhow = "1.0"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["time", "chrono"] }
once_cell = "1.20"
url = "2"
delulu-mcp-server-helper = { path = "../../delulu-internals/mcp-server-helper", optional = true }
schemars = { version = "1.0", features = ["derive"], optional = true }
rmcp = { version = "0.13", features = ["server", "macros"], optional = true }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
xberg = { version = "1.0.0-rc.32", default-features = false, features = ["html", "pdf", "tokio-runtime"] }
tempfile = "3.10"

[dev-dependencies]
zstd = "0.13"
regex = { version = "1.10", default-features = false, features = ["unicode-perl", "unicode-case"] }
rayon = "1.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-std", "io-util", "fs", "process"] }
axum = "0.7"
wreq = { version = "6.0.0-rc.26", features = ["json", "brotli", "gzip", "zstd", "tracing", "stream"] }
unicode-normalization = "0.1"

[package.metadata.mcp]
name = "delulu-webfetch"
version = "0.1.0"
description = "Web content fetching and markdown conversion services"

[[bin]]
name = "delulu-fetch"
path = "src/main_cli.rs"
required-features = ["cli"]

[[bin]]
name = "delulu-webfetch-mcp"
path = "src/main_mcp.rs"
required-features = ["mcp"]

[[test]]
name = "diag_rd_pipeline"
path = "tests/pipeline_readability/diag_rd_pipeline.rs"


[[test]]
name = "diag_tf_pipeline"
path = "tests/pipeline_trafilatura/diag_tf_pipeline.rs"

[[test]]
name = "diag_tf_trace"
path = "tests/pipeline_trafilatura/diag_tf_trace.rs"

[[test]]
name = "t_webfetch_mcp"
path = "tests/t_webfetch_mcp.rs"
required-features = ["mcp"]

[[test]]
name = "t_ssrf_validate_url_e2e"
path = "tests/t_ssrf_validate_url_e2e.rs"
required-features = ["mcp"]

[[test]]
name = "t_ssrf_validate_url_unit"
path = "tests/t_ssrf_validate_url_unit.rs"
required-features = ["mcp"]


[[test]]
name = "t_fetch_doc_e2e"
path = "tests/t_fetch_doc_e2e.rs"

[package.metadata.cargo-machete]
ignored = ["rmcp"]
