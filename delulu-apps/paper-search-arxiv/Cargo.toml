[package]
name = "delulu-paper-search-arxiv"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"
description = "arXiv paper search - CLI and MCP server"

[features]
default = ["cli", "mcp"]
cli = ["dep:clap"]
mcp = [
    "dep:rmcp",
    "dep:schemars",
    "dep:axum",
    "tracing-subscriber/env-filter",
    "tokio/signal",
    "tokio/net",
    "rmcp/transport-io",
    "rmcp/transport-streamable-http-server",
]

[dependencies]
wreq = { version = "6.0.0-rc.26", features = ["json", "brotli", "gzip", "zstd", "tracing"] }
delulu-rate-limited-crawler = { path = "../../delulu-internals/rate-limited-crawler" }
delulu-webfetch = { path = "../../delulu-apps/webfetch" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
anyhow = "1.0"
chrono = { version = "0.4.20", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["time", "chrono", "env-filter"] }
urlencoding = "2"
schemars = { version = "1.0", features = ["derive"], optional = true }
axum = { version = "0.7", optional = true }
rmcp = { version = "0.13", features = ["server", "macros"], optional = true }

[dev-dependencies]
zstd = { version = "0.13", features = ["experimental"] }
paper-search-test-utils = { path = "../../delulu-internals/paper-search-test-utils" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "process"] }

[package.metadata.mcp]
name = "delulu-paper-search-arxiv"
version = "0.1.0"
description = "Search papers on arXiv by keyword, author, title, or abstract"

[[bin]]
name = "delulu-arxiv"
path = "src/main_cli.rs"
required-features = ["cli"]

[[bin]]
name = "delulu-arxiv-mcp"
path = "src/main_mcp.rs"


[[test]]
name = "arxiv_integration"
path = "tests/integration/arxiv_integration_test.rs"

[[test]]
name = "arxiv_mcp_e2e"
path = "tests/integration/arxiv_mcp_e2e_test.rs"
required-features = ["mcp"]

[[test]]
name = "arxiv_mcp_e2e_http"
path = "tests/integration/arxiv_mcp_e2e_http_test.rs"
required-features = ["mcp"]
