[project]
name = "delulu-websearch-tests"
version = "0.1.0"
description = "MCP integration tests for delulu-websearch"
requires-python = ">=3.12"
dependencies = ["mcp>=1.0,<2"]  # mcp 2.x is a breaking rewrite (renamed exceptions, snake_case fields)

[dependency-groups]
dev = [
    "codespell>=2.4.3",
    "typos>=1.48.0",
]
