[package]
name = "delulu-paper-search-pubmed"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"
description = "PubMed paper search - CLI and MCP server"

[features]
default = ["cli", "mcp"]
cli = ["dep:clap"]
mcp = [
    "dep:schemars",
    "dep:rmcp",
    "dep:delulu-mcp-server-helper",
]

[dependencies]
delulu-rate-limited-crawler = { path = "../../delulu-internals/rate-limited-crawler" }
delulu-webfetch = { path = "../webfetch" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["time", "chrono"] }
urlencoding = "2"
delulu-mcp-server-helper = { path = "../../delulu-internals/mcp-server-helper", optional = true }
schemars = { version = "1.0", features = ["derive"], optional = true }
rmcp = { version = "0.13", features = ["server", "macros"], optional = true }
futures-util = "0.3"

[package.metadata.mcp]
name = "delulu-paper-search-pubmed"
version = "0.1.0"
description = "Search biomedical papers on PubMed by keyword, author, or date"

[[bin]]
name = "delulu-pubmed"
path = "src/main_cli.rs"
required-features = ["cli"]

[[bin]]
name = "delulu-pubmed-mcp"
path = "src/main_mcp.rs"
required-features = ["mcp"]


[[test]]
name = "pubmed_integration"
path = "tests/integration/pubmed_integration_test.rs"

[dev-dependencies]
zstd = { version = "0.13", features = ["experimental"] }
paper-search-test-utils = { path = "../../delulu-internals/paper-search-test-utils" }

[[test]]
name = "pubmed_mcp_e2e"
path = "tests/integration/pubmed_mcp_e2e_test.rs"
required-features = ["mcp"]

[package.metadata.cargo-machete]
ignored = ["rmcp"]
