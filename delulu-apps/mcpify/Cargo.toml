[package]
name = "delulu-mcpify"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"
description = "Turn OpenAPI spec into MCP server"

[features]
default = ["mcp"]
mcp = [
    "dep:rmcp",
    "dep:schemars",
    "dep:axum",
    "tracing-subscriber/env-filter",
    "tokio/signal",
    "rmcp/transport-io",
    "rmcp/transport-streamable-http-server",
]

[dependencies]
wreq = { version = "6.0.0-rc.26", features = ["json", "tracing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["time", "chrono"] }
serde_yaml = "0.9"
url = "2.5"
urlencoding = "2"
futures = "0.3"
schemars = { version = "1.0", features = ["derive"], optional = true }
axum = { version = "0.8", optional = true }
rmcp = { version = "0.13", features = ["server", "macros"], optional = true }

[[bin]]
name = "mcpify"
path = "src/main.rs"
required-features = ["mcp"]

[[test]]
name = "pipeline_registration"
path = "tests/integration/pipeline_registration.rs"
required-features = ["mcp"]

[[test]]
name = "mcpify_e2e_http"
path = "tests/integration/end_to_end/http_test.rs"
required-features = ["mcp"]

[[test]]
name = "mcpify_e2e_stdio"
path = "tests/integration/end_to_end/stdio_test.rs"
required-features = ["mcp"]
